<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Virtual Pets v2.0</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a0f;
            --surface: rgba(20, 20, 30, 0.7);
            --text: #e8e8f0;
            --hint: #7a7a9e;
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --gold: #fdcb6e;
            --red: #ff7675;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        #main-menu {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(ellipse at 50% 30%, #1a1a3e 0%, #0a0a0f 70%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            gap: 12px;
        }
        #main-menu h1 {
            font-size: 36px;
            font-weight: 800;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .version-badge {
            color: var(--gold);
            font-size: 12px;
            font-weight: 600;
            background: rgba(253, 203, 110, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(253, 203, 110, 0.3);
        }
        .menu-icon {
            font-size: 60px;
            margin-bottom: 5px;
            filter: drop-shadow(0 0 20px rgba(108, 92, 231, 0.5));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-8px);
            }
        }
        #username-greet {
            color: var(--accent2);
            font-weight: 600;
            font-size: 18px;
            background: rgba(0, 206, 201, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
        }
        .lang-select {
            display: flex;
            gap: 8px;
            background: var(--surface);
            padding: 6px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .lang-btn {
            background: transparent;
            border: none;
            color: var(--hint);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }
        .btn-glass {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 14px 40px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 220px;
        }
        .btn-glass.primary {
            background: var(--accent);
            border: 1px solid rgba(108, 92, 231, 0.5);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.25);
        }
        .btn-glass.primary:active {
            transform: scale(0.97);
        }
        .btn-glass.secondary {
            border-color: rgba(255, 255, 255, 0.15);
        }
        .btn-glass.secondary:active {
            transform: scale(0.97);
        }
        .game-screen {
            display: none;
            flex-direction: column;
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        .game-screen.active {
            display: flex;
        }
        .pet-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            transition: all 1s;
        }
        .pet-bg.bg-default {
            background: radial-gradient(ellipse at 50% 40%, #1a1a3e 0%, #0a0a0f 70%);
        }
        .pet-bg.bg-space {
            background: radial-gradient(ellipse at 50% 40%, #0d1b2a 0%, #020510 70%);
        }
        .pet-bg.bg-forest {
            background: radial-gradient(ellipse at 50% 40%, #1a2e1a 0%, #0a1a0a 70%);
        }
        .pet-bg.bg-sunset {
            background: radial-gradient(ellipse at 50% 40%, #3e1a1a 0%, #1a0a0a 70%);
        }
        .pet-bg.bg-ocean {
            background: radial-gradient(ellipse at 50% 40%, #1a2e3e 0%, #0a1a2e 70%);
        }
        .top-navbar {
            display: flex;
            justify-content: space-between;
            padding: 12px 16px;
            z-index: 10;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .currency-badge {
            background: var(--surface);
            backdrop-filter: blur(10px);
            padding: 10px 16px;
            border-radius: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 13px;
        }
        .currency-badge.coins {
            color: #00cec9;
        }
        .currency-badge.crystals {
            color: #a29bfe;
        }
        .currency-badge.level {
            color: #fdcb6e;
            cursor: pointer;
        }
        .currency-badge.level:hover {
            opacity: 0.8;
        }
        .mood-indicator {
            background: var(--surface);
            backdrop-filter: blur(10px);
            padding: 8px 14px;
            border-radius: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            font-size: 12px;
        }
        .bottom-sheet {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100vw;
            height: 40vh;
            background: var(--surface);
            backdrop-filter: blur(15px);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px 24px 0 0;
            display: flex;
            flex-direction: column;
            z-index: 20;
            padding: 0 16px 16px;
        }
        .main-tabs-bar {
            display: flex;
            padding: 12px 0 8px;
        }
        .main-tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--hint);
            padding: 10px 4px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        .main-tab-btn.active {
            color: #fff;
            border-bottom-color: var(--accent);
        }
        .sub-tabs-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 10px;
            overflow-x: auto;
        }
        .sub-tab-btn {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--hint);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }
        .sub-tab-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: transparent;
        }
        .shop-scroll-zone {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 10px;
        }
        .section-title {
            font-size: 10px;
            text-transform: uppercase;
            color: var(--hint);
            margin: 10px 0 6px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .item-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .shop-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 10px;
            gap: 4px;
        }
        .item-emoji {
            font-size: 26px;
        }
        .item-name {
            font-weight: 600;
            font-size: 10px;
            color: #fff;
            text-align: center;
        }
        .item-rarity {
            font-size: 8px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.3);
        }
        .item-price {
            font-weight: 600;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            background: rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .btn-action {
            width: 100%;
            background: var(--accent2);
            color: #111;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 10px;
            cursor: pointer;
        }
        .btn-action.equipped {
            background: var(--red);
            color: #fff;
        }
        .btn-action.purchased {
            background: var(--accent);
            color: #fff;
        }
        .btn-action.sell-btn {
            background: #fdcb6e;
            color: #111;
        }
        .btn-open-case {
            width: 100%;
            background: linear-gradient(135deg, #a29bfe, #6c5ce7);
            color: #fff;
            border: none;
            padding: 7px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 10px;
            cursor: pointer;
        }
        .pet-display-zone {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 40vh;
            z-index: 5;
        }
        .pet-container {
            width: 220px;
            height: 220px;
            position: relative;
            cursor: pointer;
            filter: drop-shadow(0 10px 30px rgba(108, 92, 231, 0.3));
        }
        .pet-container:active {
            transform: scale(0.95);
        }
        .pet-scale-box {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            transform: scale(0.65);
        }
        .growth-badge {
            background: var(--surface);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 10px 20px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            margin-top: 10px;
        }
        .combo-indicator {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(253, 203, 110, 0.9);
            color: #111;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 13px;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 10;
        }
        .combo-indicator.active {
            opacity: 1;
        }
        .purple-glow {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(108, 92, 231, 0.5) 0%, rgba(108, 92, 231, 0) 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }
        @keyframes tail-wag {
            0%,
            100% {
                transform: rotate(0deg);
            }
            50% {
                transform: rotate(-8deg);
            }
        }
        .anim-tail {
            animation: tail-wag 2.2s ease-in-out infinite;
            transform-origin: bottom right;
        }
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(10px);
            z-index: 200;
            display: none;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }
        #overlay.active {
            display: flex;
        }
        .overlay-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }
        .overlay-header h2 {
            font-size: 22px;
            font-weight: 800;
            color: #fdcb6e;
        }
        .close-btn {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        #username-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.9);
            z-index: 300;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .username-box {
            background: var(--surface);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            width: 90%;
            max-width: 320px;
        }
        .username-box h2 {
            color: #a29bfe;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .username-box input {
            width: 100%;
            padding: 14px;
            margin: 0 0 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #fff;
            font-size: 16px;
            text-align: center;
            outline: none;
        }
        .username-box input::placeholder {
            color: var(--hint);
        }
        .username-box button {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 14px 30px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s;
        }
        .username-box button:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>
    <div id="main-menu">
        <div class="menu-icon">🐈⭐️</div>
        <h1>Virtual Pets</h1>
        <div class="version-badge">v 2.0</div>
        <div id="username-greet">Привет, Игрок!</div>
        <p class="menu-desc" id="menu-desc">Тапай по коту! Кланы, фон, настроение, облачные сохранения!</p>
        <div class="lang-select">
            <button class="lang-btn active" onclick="setLang('ru')">🇷🇺 RU</button>
            <button class="lang-btn" onclick="setLang('en')">🇬🇧 EN</button>
        </div>
        <button class="btn-glass primary" id="btn-start-game">🎮 Войти в игру</button>
        <button class="btn-glass secondary" id="btn-leaderboard">🏆 Таблица лидеров</button>
        <button class="btn-glass secondary" id="btn-achievements">🏆 Достижения</button>
        <button class="btn-glass secondary" id="btn-profile">👤 Профиль</button>
    </div>

    <div id="username-overlay">
        <div class="username-box">
            <h2>🐾 Введите имя</h2>
            <input type="text" id="username-input" placeholder="Ваше имя" maxlength="15">
            <button id="btn-save-username">Сохранить</button>
        </div>
    </div>

    <div id="overlay"></div>

    <div class="game-screen" id="game-screen">

            <div class="currency-badge crystals">💎 <span id="balance-crystals">0</span></div>
            <div class="currency-badge level" id="btn-admin">⭐ <span id="player-level">1</span></div>
            <div class="mood-indicator" id="mood-display">😊 Счастлив</div>
            <button id="btn-fishing" style="background:#00cec9;color:#111;border:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer">🎣</button>
            <button id="btn-clan" style="background:#fdcb6e;color:#111;border:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer">🛡️</button>
            <button id="btn-leaderboard2" style="background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer">🏆</button>
            <button id="btn-achievements2" style="background:#fdcb6e;color:#111;border:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer">🏅</button>
            <button id="btn-profile2" style="background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:12px;font-weight:700;font-size:12px;cursor:pointer">👤</button>

                <div class="pet-container" id="pet-tap-area">
                    <div class="combo-indicator" id="combo-indicator">x1</div>

        async function saveData() { const data = JSON.stringify({ coins: userCoins, crystals: userCrystals, level: playerLevel,
                tapsForLevel, tapsNeeded: tapsNeededForLevel, stageIndex: currentStageIndex, secondsLeft: secondsToGrow,
                purchased: purchasedItems, purchasedSkins, purchasedBackgrounds, equippedHat: slots.hat, equippedBody: slots
                .body, equippedSkin: slots.skin, equippedBackground: slots.background, lastDailyClaim, username, lang,
                usedPromos, userEmoji, userBio, playSeconds, isJuniorAdmin, userAchievements, fishCaught, catMood,
                clanName });
            localStorage.setItem('vpg_save', data); if (tg?.CloudStorage) { tg.CloudStorage.setItem('vpg_save', data, (
                    err, success) => { if (success) console.log('✅ Сохранено в Telegram Cloud'); }); } if (username &&
                clanName) { try { await fetch(CLAN_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ clan: clanName, user: username, coins: userCoins, crystals: userCrystals,
                            level: playerLevel }) }); } catch (e) {} } }

        function loadData() { if (tg?.CloudStorage) { tg.CloudStorage.getItem('vpg_save', (err, value) => { if (value) {
                        parseGameData(value); return; } const raw = localStorage.getItem('vpg_save'); if (raw)
                    parseGameData(raw); }); } else { const raw = localStorage.getItem('vpg_save'); if (raw)
            parseGameData(raw); } }

        function parseGameData(raw) { try { const d = JSON.parse(raw);
                userCoins = d.coins || 100;
                userCrystals = d.crystals || 0;
                playerLevel = d.level || 1;
                tapsForLevel = d.tapsForLevel || 0;
                tapsNeededForLevel = d.tapsNeeded || 50;
                lastDailyClaim = d.lastDailyClaim || null;
                username = d.username || null;
                lang = d.lang || 'ru';
                usedPromos = d.usedPromos || [];
                userEmoji = d.userEmoji || '🐈';
                userBio = d.userBio || '';
                playSeconds = d.playSeconds || 0;
                isJuniorAdmin = d.isJuniorAdmin || false;
                fishCaught = d.fishCaught || 0;
                catMood = d.catMood || 'happy';
                clanName = d.clanName || ''; if (d.userAchievements) userAchievements = d.userAchievements; if (d
                    .purchasedBackgrounds) purchasedBackgrounds = { ...purchasedBackgrounds, ...d
                    .purchasedBackgrounds }; if (d.equippedBackground) slots.background = d.equippedBackground;
                document.getElementById('balance-coins').innerText = userCoins;
                document.getElementById('balance-crystals').innerText = userCrystals;
                document.getElementById('player-level').innerText = playerLevel;
                document.getElementById('taps-to-level').innerText = tapsNeededForLevel - tapsForLevel;
                document.getElementById('play-time').innerText = playSeconds;
                currentStageIndex = d.stageIndex || 0;
                secondsToGrow = d.secondsLeft || 15;
                updateStageDisplay();
                updateMoodDisplay();
                applyBackground(); if (d.purchased) purchasedItems = { ...purchasedItems, ...d.purchased }; if (d
                    .purchasedSkins) purchasedSkins = { ...purchasedSkins, ...d.purchasedSkins }; if (d.equippedSkin)
                    slots.skin = d.equippedSkin; if (d.equippedHat) slots.hat = d.equippedHat; if (d.equippedBody)
                    slots.body = d.equippedBody;
                updateDailyBonusButton();
                updateEquippedDisplay();
                applySkin();
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active')); if (lang === 'ru')
                    document.querySelectorAll('.lang-btn')[0].classList.add('active'); else document.querySelectorAll(
                        '.lang-btn')[1].classList.add('active');
                updateAllTexts(); if (isJuniorAdmin || isDev()) document.getElementById('admin-console').style.display =
                    'block'; } catch (e) {} }

        function updateStageDisplay() { const s = stages[currentStageIndex];
            document.getElementById('growth-stage').innerText = s.text[lang];
            document.getElementById('growth-stage').style.color = s.color;
            document.getElementById('pet-scaler').style.transform = `scale(${s.scale})`; }

        function startGrowthEngine() { if (growthTimer) return;
            growthTimer = setInterval(() => { if (currentStageIndex >= 2) { document.getElementById('timer-seconds')
                        .innerText = 'MAX';
                    clearInterval(growthTimer); return; }
                secondsToGrow--;
                document.getElementById('timer-seconds').innerText = secondsToGrow;
                saveData(); if (secondsToGrow <= 0) { currentStageIndex++;
                    updateStageDisplay();
                    secondsToGrow = 15;
                    saveData(); } }, 1000); }

        function startPlayTimer() { if (playTimer) return;
            playTimer = setInterval(() => { playSeconds++;
                document.getElementById('play-time').innerText = playSeconds;
                saveData(); }, 1000); }

        async function syncLeaderboard() { try { await fetch(LEADERBOARD_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: username, coins: userCoins, crystals: userCrystals, level: playerLevel,
                        avatar: userEmoji, equippedHat: slots.hat, equippedBody: slots.body, equippedSkin: slots.skin,
                        bio: userBio, telegramId: tg?.initDataUnsafe?.user?.id, likes: playerLikes[username] || 0,
                        achievements: userAchievements, clan: clanName }) }); } catch (e) {} }

        async function loadLeaderboard() { try { const res = await fetch(LEADERBOARD_URL); if (res.ok) { globalPlayers =
                        await res.json();
                    updateLeaderboardDisplay(); } else { document.getElementById('leaderboard-list').innerHTML =
                        '<div style="color:#888;text-align:center">Ошибка загрузки</div>'; } } catch (e) {
                globalPlayers = [{ name: username, coins: userCoins, crystals: userCrystals, level: playerLevel, avatar: userEmoji,
                    bio: userBio }];
                updateLeaderboardDisplay(); } }

        function updateLeaderboardDisplay() { if (!globalPlayers.length) { document.getElementById('leaderboard-list')
                .innerHTML = '<div style="color:#888;text-align:center">Пока никого нет</div>'; return; }
            document.getElementById('leaderboard-list').innerHTML = globalPlayers.map((p, i) => { const re = i === 0 ?
                    '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i+1}`; const isDevPlayer = p.telegramId && DEV_IDS
                    .includes(String(p.telegramId)); return `<div class="leaderboard-item ${p.name===username?'current-user':''}" style="background:var(--surface);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:12px;cursor:pointer"><div class="leaderboard-rank ${i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':''}" style="font-size:20px;font-weight:700;min-width:32px;text-align:center">${re}</div><div class="leaderboard-avatar" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:24px">${p.avatar||'🐈'}</div><div class="leaderboard-info" style="flex:1"><div class="leaderboard-name" style="font-weight:600;font-size:14px">${p.name}${p.name===username?' (Вы)':''}${isDevPlayer?' <span class="dev-badge" style="background:#fdcb6e;color:#111;font-size:8px;padding:2px 6px;border-radius:4px;font-weight:700;margin-left:6px">DEV</span>':''}${p.clan?` <span style="color:#fdcb6e;font-size:10px">[${p.clan}]</span>`:''}</div>${p.bio?`<div class="leaderboard-bio" style="font-size:10px;color:var(--hint);margin-top:2px;font-style:italic">${p.bio}</div>`:''}<div class="leaderboard-stats" style="font-size:11px;color:var(--hint);margin-top:2px"><span class="leaderboard-balance" style="color:#00cec9;font-weight:600">🐾 ${(p.coins||0).toLocaleString()}</span> 💎 ${p.crystals||0}</div></div><div>⭐${p.level||1} ${p.likes?'❤️'+p.likes:''}</div></div>`; }).join(''); }

        function showOverlay(title, content) { const overlay = document.getElementById('overlay');
            overlay.innerHTML =
                `<div class="overlay-header"><h2>${title}</h2><button class="close-btn" onclick="hideOverlay()">${t('close')}</button></div>${content}`;
            overlay.classList.add('active'); }

        function hideOverlay() { document.getElementById('overlay').classList.remove('active'); }

        function openLeaderboard() { document.getElementById('overlay').innerHTML =
                '<div class="overlay-header"><h2>🏆 Таблица лидеров</h2><button class="close-btn" onclick="hideOverlay()">Закрыть</button></div><div id="leaderboard-list"></div>';
            document.getElementById('overlay').classList.add('active');
            loadLeaderboard(); }

        function openAchievements() { const content = achievements.map(a => { const completed = userAchievements.includes(
                a.id); return `<div class="task-item" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:12px;margin-bottom:8px;display:flex;align-items:center;gap:10px"><div class="task-icon" style="font-size:26px">${a.emoji}</div><div class="task-info" style="flex:1"><div class="task-name" style="color:#fff;font-weight:600;font-size:13px">${a.name[lang]}</div><div class="task-reward" style="color:#a29bfe;font-size:10px">${a.desc[lang]} • +${a.reward} 💎</div></div>${completed?`<button class="task-btn claimed" disabled style="background:#444;color:#888;border:none;padding:8px 14px;border-radius:10px;font-weight:600;font-size:10px;cursor:pointer">${t('taskCompleted')}</button>`:`<button class="task-btn" onclick="claimAchievement('${a.id}')" style="background:var(--accent);color:#fff;border:none;padding:8px 14px;border-radius:10px;font-weight:600;font-size:10px;cursor:pointer">${t('claim')}</button>`}</div>`; })
            .join('');
            showOverlay('🏆 Достижения', content); }

        function openProfile() { const emojiPicker = ['🐈', '🐕', '🐰', '🐼', '🦊', '🐨', '🐸', '🐵', '🦁', '🐯', '🐮', '🐷', '🐭',
                '🐹', '🐻', '🐔', '🐧', '🐦', '🐤', '🦄', '🐲', '🐙', '🦑', '🦀', '🐳', '🐬', '🦈', '🐊', '🐅', '🐆', '🐘',
                '🦒', '🦘', '🦥', '🦦', '🦩', '🦜', '🦚', '🦢', '🦉', '🦇', '🦋', '🐌', '🐛', '🐜', '🐝', '🐞', '🦗', '🕷️',
                '🦂', '🦟', '🦠', '🌵', '🎃', '🤖', '👻', '👽', '😺', '😸', '😹', '😻', '😼', '😽', '🙀', '😿', '😾'
            ]; const content = `
        <div style="text-align:center">
          <div style="font-size:45px">${userEmoji}</div>
          ${isDev()||isJuniorAdmin?'<div style="color:#fdcb6e;font-size:11px;margin:4px 0">👑 Разработчик</div>':''}
          <div style="color:var(--hint);font-size:12px;margin:6px 0">${t('selectAvatar')}</div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0">${emojiPicker.map(e=>`<span style="font-size:28px;cursor:pointer;padding:4px;border:2px solid ${e===userEmoji?'#fdcb6e':'transparent'};border-radius:10px;background:rgba(255,255,255,0.03)" onclick="selectEmoji('${e}')">${e}</span>`).join('')}</div>
          <div style="color:var(--hint);font-size:12px;margin-top:10px">${t('aboutMe')}</div>
          <textarea id="bio-input" placeholder="${t('bioPlaceholder')}" maxlength="60" style="width:100%;padding:10px;margin:8px 0;border-radius:10px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.3);color:#fff;font-size:13px;resize:vertical;min-height:50px">${userBio}</textarea>
          <div style="color:#fdcb6e;font-size:11px;margin-top:8px">🏆 Достижения</div>
          <div style="display:flex;flex-wrap:wrap;gap:4px;justify-content:center">${userAchievements.map(id=>{const a=achievements.find(ach=>ach.id===id);return a?`<span style="display:inline-block;background:rgba(253,203,110,0.1);border:1px solid rgba(253,203,110,0.3);border-radius:8px;padding:4px 8px;margin:2px;font-size:9px;color:#fdcb6e">${a.emoji} ${a.name[lang]}</span>`:'';}).join('')}</div>
          <button onclick="saveProfile()" style="background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:12px;font-weight:600;cursor:pointer;margin:4px">💾 ${t('save')}</button>
        </div>`;
            showOverlay('👤 ' + t('myProfile'), content); }

        function selectEmoji(emoji) { userEmoji = emoji;
            saveData();
            openProfile(); }

        function saveProfile() { userBio = document.getElementById('bio-input')?.value?.trim()?.substring(0, 60) || '';
            saveData();
            syncLeaderboard();
            hideOverlay(); if (tg) tg.showAlert('✅ Профиль обновлён!'); }

        function checkAchievements() { let earned = false;
            achievements.forEach(a => { if (!userAchievements.includes(a.id) && a.check()) { userAchievements.push(a.id);
                    userCrystals += a.reward;
                    earned = true; if (tg) tg.showAlert(`🏆 ${a.name[lang]}! +${a.reward} 💎`); } }); if (earned) { document
                    .getElementById('balance-crystals').innerText = userCrystals;
                saveData();
                syncLeaderboard(); } }

        function claimAchievement(id) { const a = achievements.find(ach => ach.id === id); if (!a || userAchievements
                .includes(id)) return; if (a.check()) { userAchievements.push(id);
                userCrystals += a.reward;
                document.getElementById('balance-crystals').innerText = userCrystals;
                openAchievements();
                saveData();
                syncLeaderboard(); if (tg) tg.showAlert(`🏆 +${a.reward} 💎`); } else { if (tg) tg.showAlert(
                    '❌ Условие не выполнено!'); } }

        function copyInviteLink() { const link = document.querySelector('.invite-link').innerText;
            navigator.clipboard.writeText(link).then(() => { if (tg) tg.showAlert('✅ Ссылка скопирована!'); }); }

        function checkBlocked() { const myTgId = tg?.initDataUnsafe?.user?.id; if (myTgId && DEV_IDS.includes(String(
                myTgId))) return false; const blockedById = myTgId && blockedPlayers.includes(String(myTgId)); const
            blockedByName = username && blockedPlayers.includes(username); if (blockedById || blockedByName) { const reason =
                    blockReasons[myTgId] || blockReasons[username] || 'Без причины';
                document.body.innerHTML =
                    `<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#fff;text-align:center"><div><h1 style="color:#ff7675">🚫 Заблокировано</h1><p>Причина: ${reason}</p></div></div>`;
                return true; } return false; }

        function openPasswordOverlay() { document.getElementById('password-overlay').style.display = 'flex'; }

        function closePasswordOverlay() { document.getElementById('password-overlay').style.display = 'none'; }

        function checkPassword() { const pass = document.getElementById('password-input')?.value; if (pass ===
                ADMIN_PASSWORD) { adminLoggedIn = true;
                closePasswordOverlay();
                renderCurrentContent(); if (tg) tg.showAlert('✅ Админ-панель открыта!'); } else { if (tg) tg.showAlert(
                    '❌ Неверный пароль!'); } }

        function cmdAddCoins() { userCoins += 9999;
            document.getElementById('balance-coins').innerText = userCoins;
            saveData(); }

        function cmdAddCrystals() { userCrystals += 999;
            document.getElementById('balance-crystals').innerText = userCrystals;
            saveData(); }

        function cmdGiveAllItems() { Object.keys(purchasedItems).forEach(k => purchasedItems[k] = true);
            Object.keys(purchasedSkins).forEach(k => purchasedSkins[k] = true);
            renderCurrentContent();
            saveData(); }

        function cmdResetMyData() { if (confirm(t('confirmReset'))) { localStorage.removeItem('vpg_save');
                localStorage.removeItem('vpg_username');
                location.reload(); } }

        async function checkNameUnique(name) { try { const res = await fetch(LEADERBOARD_URL); const players = await res
                .json(); return !players.some(p => p.name.toLowerCase() === name.toLowerCase()); } catch (e) { return true; } }

        async function saveUsername() { const input = document.getElementById('username-input'); const name = input.value
                .trim(); if (!name) return; const isUnique = await checkNameUnique(name); if (!isUnique) { if (tg) tg
                    .showAlert(t('nameTaken')); else alert(t('nameTaken')); return; }
            username = name;
            localStorage.setItem('vpg_username', username);
            document.getElementById('username-greet').innerText =
                `${lang==='ru'?'Привет':'Hello'}, ${username}! 🐾`;
            document.getElementById('username-overlay').style.display = 'none';
            loadData();
            updateDailyBonusButton();
            updateEquippedDisplay();
            applySkin();
            applyBackground();
            setupTapHandler();
            syncLeaderboard();
            startGame(); let admins = JSON.parse(localStorage.getItem('vpg_admins') || '[]'); let juniors = JSON.parse(
                localStorage.getItem('vpg_juniors') || '[]'); if (admins.includes(username) || juniors.includes(
                username) || isDev()) { adminLoggedIn = true; if (juniors.includes(username)) isJuniorAdmin =
            true; } if (checkBlocked()) return; }

        function processReferral() { const startParam = tg?.initDataUnsafe?.start_param; if (startParam && startParam
                .startsWith('ref_')) { const refId = startParam.replace('ref_', ''); const processedRefs = JSON.parse(
                    localStorage.getItem('vpg_processed_refs') || '[]'); if (!processedRefs.includes(refId)) {
                    processedRefs.push(refId);
                    localStorage.setItem('vpg_processed_refs', JSON.stringify(processedRefs));
                    userCrystals += 50;
                    inviteCount++;
                    localStorage.setItem('vpg_invite_count', inviteCount);
                    document.getElementById('balance-crystals').innerText = userCrystals;
                    saveData();
                    syncLeaderboard();
                    checkAchievements(); if (tg) tg.showAlert('✅ +50 💎 за приглашение!'); } } }

        // Event Listeners
        document.getElementById('btn-start-game').addEventListener('click', handleEnterGame);
        document.getElementById('btn-leaderboard').addEventListener('click', openLeaderboard);
        document.getElementById('btn-achievements').addEventListener('click', openAchievements);
        document.getElementById('btn-profile').addEventListener('click', openProfile);
        document.getElementById('btn-save-username').addEventListener('click', saveUsername);
        document.getElementById('btn-admin').addEventListener('click', openPasswordOverlay);
        document.getElementById('btn-password-ok').addEventListener('click', checkPassword);
        document.getElementById('btn-password-cancel').addEventListener('click', closePasswordOverlay);
        document.getElementById('btn-leaderboard2').addEventListener('click', openLeaderboard);
        document.getElementById('btn-achievements2').addEventListener('click', openAchievements);
        document.getElementById('btn-profile2').addEventListener('click', openProfile);
        document.querySelectorAll('.main-tab-btn').forEach(btn => btn.addEventListener('click', function() { switchMainTab(
                this.dataset.tab); }));
        document.querySelectorAll('.sub-tab-btn').forEach(btn => btn.addEventListener('click', function() { const mainTab =
                this.closest('.sub-tabs-bar').id.replace('sub-tabs-', '');
            switchSubTab(mainTab, this.dataset.sub); }));

        window.onload = async function() { if (!tg || !tg.initDataUnsafe || !tg.initDataUnsafe.user) { document.body
                    .innerHTML =
                    '<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a0f;color:#fff;text-align:center;padding:20px"><div><h1 style="color:#ff7675">❌ Только Telegram</h1><p style="color:var(--hint)">Игра доступна только через Telegram Mini App!</p></div></div>'; return; }
            processReferral(); const savedUsername = localStorage.getItem('vpg_username'); if (savedUsername) { username =
                savedUsername; if (checkBlocked()) return;
                document.getElementById('username-greet').innerText =
                `${lang==='ru'?'Привет':'Hello'}, ${username}! 🐾`;
                document.getElementById('username-overlay').style.display = 'none';
                loadData();
                updateDailyBonusButton();
                updateEquippedDisplay();
                applySkin();
                applyBackground();
                setupTapHandler();
                syncLeaderboard(); let admins = JSON.parse(localStorage.getItem('vpg_admins') || '[]'); let juniors = JSON
                    .parse(localStorage.getItem('vpg_juniors') || '[]'); if (admins.includes(username) || juniors
                    .includes(username) || isDev()) { adminLoggedIn = true; if (juniors.includes(username))
                        isJuniorAdmin = true; } } else { document.getElementById('username-greet').innerText = t('greet'); }
        };
    </script>
</body>
</html>
